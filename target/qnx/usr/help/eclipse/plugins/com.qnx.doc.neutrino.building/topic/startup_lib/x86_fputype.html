<pre class="pre codeblock">unsigned x86_64_fputype (void)

		<div class="section"><h2 class="title sectiontitle">Description:</h2>
			<p class="p">An x86-only function that returns the FPU type number (e.g. <span class="keyword const">387</span>). </p>

			<p class="p">For backward compatibility, <span class="keyword apiname">x86_fputype()</span> is defined to be the same as
				<span class="keyword apiname">x86_64_fputype()</span>.</p>

		</div>
