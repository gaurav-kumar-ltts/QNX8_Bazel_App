<h1 class="title topictitle1" id="ariaid-title1">SPI</h1>


<div class="body conbody">

<p class="p">The BSP that QNX provides for each reference board contains an SPI driver.
	If this driver does not work with your custom board, you can customize it.
</p>


<p class="p">For information about the SPI framework that implements the driver,
	refer to the <a class="xref" href="../../com.qnx.doc.neutrino.spi_framework/topic/about.html">SPI (Serial Peripheral Interface) Framework Technotes</a>.
</p>
