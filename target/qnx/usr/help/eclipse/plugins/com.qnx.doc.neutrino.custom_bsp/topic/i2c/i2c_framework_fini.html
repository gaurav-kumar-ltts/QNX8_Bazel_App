<h1 class="title topictitle1" id="ariaid-title1"><var class="keyword varname">fini</var> function</h1>


<div class="body conbody">

<p class="p">The <var class="keyword varname">fini</var> function cleans up the driver and frees any memory
associated with the given handle.
The prototype for this function is:

</p>

<pre class="pre codeblock">void <var class="keyword varname">fini</var>( void *<var class="keyword varname">hdl</var>);
</pre>

<p class="p">The argument is the handle that the <var class="keyword varname">init</var> function returned.

</p>
