  <h1 class="title topictitle1" id="ariaid-title1">Serial port</h1>

 
  
 
  <div class="body conbody">



      <p class="p">The BSP that QNX provides for each reference board contains a driver for a serial port. If
      this driver does not work with your custom board, you can customize it. </p>

    
    <p class="p">For information on the serial port drivers, see the devc-* entries in <em class="ph i">Utilities
      Reference</em>. For example, see <a class="xref" href="../../com.qnx.doc.neutrino.utilities/topic/d/devc-serpci.html"><span class="ph codeph">devc-serpci</span></a>.</p>

 

  </div>
