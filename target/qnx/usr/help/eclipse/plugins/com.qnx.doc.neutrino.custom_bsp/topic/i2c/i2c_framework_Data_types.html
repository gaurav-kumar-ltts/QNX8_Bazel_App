<h1 class="title topictitle1" id="ariaid-title1">Supporting data types</h1>


<div class="body conbody">

<p class="p">Many of the <span class="keyword apiname">devctl()</span> commands use the <span class="keyword dtype">i2c_addr_t</span>
structure, which is defined as:

</p>

<pre class="pre codeblock">typedef struct {
    uint32_t addr;   /* I2C address */
    uint32_t fmt;    /* I2C_ADDRFMT_7BIT or I2C_ADDRFMT_10BIT */
} i2c_addr_t;
</pre>
