<body id="bus_reset">

<h1 class="title topictitle1" id="ariaid-title1"><var class="keyword varname">bus_reset</var> function</h1>


<div class="body conbody">

<p class="p">The <var class="keyword varname">bus_reset</var> function resets the I2C bus module.
The prototype for this function is:

</p>

<pre class="pre codeblock">int <var class="keyword varname">bus_reset</var>( void *<var class="keyword varname">hdl</var> );
</pre>

<p class="p">The argument is the handle that the <var class="keyword varname">init</var> function returned.

</p>



<p class="p">The function must return:

</p>

<dl class="dl compact">


<dt class="dt dlterm"><span class="keyword const">EOK</span></dt>


<dd class="dd">Success.

</dd>




<dt class="dt dlterm"><span class="keyword const">EIO</span></dt>


<dd class="dd">Failure.

</dd>



</dl>
