<h1 class="title topictitle1" id="ariaid-title1">HA-specific modules</h1>






<div class="body conbody"><p class="shortdesc"></p>


<p class="p">
Apart from its inherently robust architecture, <span class="keyword">QNX OS</span> also
provides an <a class="xref" href="ham_HAM.html" title="The High Availability Manager (HAM) provides a mechanism for monitoring processes and services on your system.">HA Manager</a>—a <q class="q">smart watchdog</q> that
  can perform multistage recovery whenever system services or processes fail.
</p>
