<h1 class="title topictitle1" id="ariaid-title1">Logging out</h1>






<div class="body conbody"><p class="shortdesc"></p>


<p class="p">




To log out, type
<a class="xref" href="../../com.qnx.doc.neutrino.utilities/topic/l/logout.html"><span class="keyword cmdname">logout</span></a>
at the command prompt.
You can also log out by terminating your login shell;
just enter the <span class="keyword cmdname">exit</span> shell command or press
<span class="keyword keychord"><span class="keyword key">Ctrl</span><span class="keyword key">D</span></span>.
</p>
