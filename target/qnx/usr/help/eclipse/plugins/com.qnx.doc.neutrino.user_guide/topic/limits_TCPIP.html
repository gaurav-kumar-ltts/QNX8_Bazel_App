<h1 class="title topictitle1" id="ariaid-title1">TCP/IP limits</h1>






<div class="body conbody"><p class="shortdesc"></p>


<p class="p">



The number of open connections and sockets is limited only by memory and
by the maximum number of file descriptors per process (see
<q class="q"><a class="xref" href="limits_FileDescriptors.html" title="The total number of file descriptors has a hard limit of 32767 per process, but you're more likely to be constrained by the -F option to procnto or the RLIMIT_NOFILE system resource. The default value is 1000; the minimum is 100.">File descriptors</a></q>).
</p>
