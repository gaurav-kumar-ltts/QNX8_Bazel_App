<h1 class="title topictitle1" id="ariaid-title1">Choosing between wide and fast modes</h1>


<div class="body conbody">

<p class="p">



By default, the instrumented kernel and <span class="keyword cmdname">tracelogger</span> collect
data in fast mode; to switch to wide mode, specify the <span class="keyword option">-w</span>
option when you start <span class="keyword cmdname">tracelogger</span>.
</p>
