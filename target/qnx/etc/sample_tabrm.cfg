{
    // The TABRM service gets the combined configuration for both modules it
    // loads (RM & TCTI).  The TABRM configuration elements are at the root
    // level of the enclosing object, and the module configurations are found in
    // the tcti_mod_config and rm_mod_config objects.  If any part of the TABRM
    // configuration is omitted, TABRM will use the default values for the
    // missing elements.  If extra elements are found in the TABRM
    // configuration, they will simply be ignored.
    //
    // Indicates the service should be daemonized (background = true) or not
    // (background = false).
    // default: true
    "background":true,
    // Downgrade from root to the specified user (u), and optionally, groups
    // (g), in the form:
    // "drop_root_ids":"u[:g,...]"
    // The only way to prevent dropping root privileges is to not specify this
    // argument.
    // default: Don't drop root privileges.
    "drop_root_ids":"3:5,6,9",
    // The registered TABRM resource manager path.
    // default: "/dev/tpmrm0"
    "dev_path_name":"/dev/tpmrm0",
    // The name (with optional path) of the TCTI module.
    // default: "libtabrm_tcti_mod.so"
    "tcti_module_name":"libtabrm_tcti_mod.so",
    // The name (with optional path) of the RM module.
    // default: "tabrm_rm_mod.so"
    "rm_module_name":"tabrm_rm_mod.so",
    // Configuration details passed to the TCTI module.  For more details
    // related to it, refer to the configuration details of the specified
    // module.
    // If this item is omitted, the default is an absent (NULL) configuration
    // provided to the module, and the module itself would then typically use
    // its own set of default values (as per the TCTI standard).
    // This configuration can be specified in two ways, and depends on what the
    // module expects.  If a non-json string is expected by the library,
    // "tcti_mod_config" should be specified as a string here.  When the module
    // expects a json string, a json object can be specified here, and tabrm
    // will convert it to a json string before passing it to the tcti library.
    // It is also an option to specify "tcti_mod_config" as a json string
    // (instead of an object) in that case.
    "tcti_mod_config": {
        // TCTI module configuration details
    },
    // Configuration details passed to the RM module.  For more details related
    // to it, refer to the configuration details of the specified module.
    // If this item is omitted, the default is an absent configuration for the
    // module, and the module itself would then typically use its own set of
    // default values.
    "rm_mod_config": {
        // RM module configuration details
    }
}
