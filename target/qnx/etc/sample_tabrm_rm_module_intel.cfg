{
    // This module only gets the part of the TABRM configuration found within
    // the rm_mod_config section.  If any part of this configuration is omitted,
    // the module will use the default values for the missing elements.  If
    // extra elements are found in the rm_mod_config part of the configuration,
    // they will simply be ignored.
    // If other sections of the configuration for TABRM and / or the TCTI module
    // are required, they would live alongside the rm_mod_config section.
    "rm_mod_config": {
        // Whether the module should flush all sessions on startup.
        // default: false
        "flush_all_sessions":false,
        // The maximum number of sessions
        // default: 4, min: 1, max: 64
        "max_sessions":4
        // The maximum number of transient objects
        // default: 27, min: 1, max: 100
        "max_transient_objects":27
    }
}
